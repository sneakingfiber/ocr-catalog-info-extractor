[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-catalog-info-extractor"
version = "0.1.0"
description = "Extract structured product data (EAN, code, size, packaging, price) from PDF catalogs into Excel using a local OCR model and deterministic parsing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "pdf2image>=1.17",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "requests>=2.28",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
catalog-extract = "catalog_extractor.cli:main"

[tool.setuptools]
packages = ["catalog_extractor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
